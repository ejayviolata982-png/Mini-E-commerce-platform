"openapi: 3.0.0
info:
  title: ShopEase API
  description: Mini E-Commerce Platform REST API
  version: 1.0.0
servers:
  - url: https://shopease-server-lqqa.onrender.com/api
    description: Production
  - url: http://localhost:3000/api
    description: Local Development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: Juan dela Cruz }
                email: { type: string, example: juan@email.com }
                password: { type: string, example: Password@123 }
                phone: { type: string, example: "09123456789" }
      responses:
        201: { description: User registered successfully }
        400: { description: Validation error }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, example: juan@email.com }
                password: { type: string, example: Password@123 }
      responses:
        200: { description: Login successful, returns JWT token }
        401: { description: Invalid credentials }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current logged in user
      responses:
        200: { description: Current user data }
        401: { description: Unauthorized }

  /products:
    get:
      tags: [Products]
      summary: Get all products
      security: []
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 12 }
      responses:
        200: { description: List of products }

    post:
      tags: [Products]
      summary: Create a product (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: Coffee Beans 1kg }
                price: { type: number, example: 799 }
                stock: { type: integer, example: 50 }
                categoryId: { type: string }
                categoryName: { type: string, example: Food }
                description: { type: string }
                imageUrl: { type: string }
      responses:
        201: { description: Product created }
        400: { description: Validation error }

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product by ID
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200: { description: Product data }
        404: { description: Product not found }

    put:
      tags: [Products]
      summary: Update product (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                price: { type: number }
                stock: { type: integer }
                categoryId: { type: string }
                categoryName: { type: string }
                description: { type: string }
                imageUrl: { type: string }
      responses:
        200: { description: Product updated }
        404: { description: Product not found }

    delete:
      tags: [Products]
      summary: Delete product (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200: { description: Product deleted }
        404: { description: Product not found }

  /categories:
    get:
      tags: [Categories]
      summary: Get all categories
      security: []
      responses:
        200: { description: List of categories }

    post:
      tags: [Categories]
      summary: Create category (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: Electronics }
                icon: { type: string, example: "💻" }
                description: { type: string }
      responses:
        201: { description: Category created }

  /categories/{id}:
    put:
      tags: [Categories]
      summary: Update category (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                icon: { type: string }
                description: { type: string }
      responses:
        200: { description: Category updated }

    delete:
      tags: [Categories]
      summary: Delete category (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200: { description: Category deleted }

  /orders:
    post:
      tags: [Orders]
      summary: Place a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productId: { type: string }
                      name: { type: string }
                      price: { type: number }
                      quantity: { type: integer }
                      imageUrl: { type: string }
                shippingAddress:
                  type: object
                  properties:
                    name: { type: string }
                    phone: { type: string }
                    address: { type: string }
                paymentMethod: { type: string, example: cod }
                totalAmount: { type: number }
      responses:
        201: { description: Order placed successfully }

    get:
      tags: [Orders]
      summary: Get all orders (Admin only)
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
      responses:
        200: { description: List of all orders }

  /orders/my:
    get:
      tags: [Orders]
      summary: Get current user orders
      responses:
        200: { description: List of user orders }

  /orders/dashboard:
    get:
      tags: [Orders]
      summary: Get dashboard statistics (Admin only)
      responses:
        200: { description: Dashboard stats }

  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update order status (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, processing, shipped, delivered, cancelled]
      responses:
        200: { description: Order status updated }

  /orders/{id}/cancel-request:
    post:
      tags: [Orders]
      summary: Request order cancellation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, example: Changed my mind }
      responses:
        200: { description: Cancel request submitted }
        400: { description: Order cannot be cancelled }

  /orders/{id}/cancel-action:
    post:
      tags: [Orders]
      summary: Approve or reject cancel request (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [approve, reject]
      responses:
        200: { description: Cancel request handled }

  /cart:
    get:
      tags: [Cart]
      summary: Get user cart
      responses:
        200: { description: Cart data }

    post:
      tags: [Cart]
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId: { type: string }
                name: { type: string }
                price: { type: number }
                quantity: { type: integer }
                imageUrl: { type: string }
      responses:
        200: { description: Item added to cart }

    delete:
      tags: [Cart]
      summary: Clear entire cart
      responses:
        200: { description: Cart cleared }

  /cart/{itemId}:
    put:
      tags: [Cart]
      summary: Update cart item quantity
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer }
      responses:
        200: { description: Cart item updated }

    delete:
      tags: [Cart]
      summary: Remove item from cart
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      responses:
        200: { description: Item removed }

  /users:
    get:
      tags: [Users]
      summary: Get all users (Admin only)
      responses:
        200: { description: List of users }

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200: { description: User data }

    put:
      tags: [Users]
      summary: Update user profile
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                address: { type: string }
      responses:
        200: { description: User updated }" 
